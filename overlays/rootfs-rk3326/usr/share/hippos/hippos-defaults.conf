# HippOS OS-level settings defaults — RK3326 handhelds (R36S).
# User overrides are written to /userdata/system/hippos.conf by hippos-settings.

system.session=es
system.boot_session=es
desktop.controller_mouse=1
desktop.onscreen_keyboard=1
desktop.maximize_windows=1
system.autologin=true
system.hostname=hippos
system.services=
system.suspendmode=suspend
system.cpu.governor=ondemand
system.cpu.balanced_governor=ondemand
system.cpu.max_freq=1296000
system.cpu.ondemand.up_threshold=85
system.cpu.ondemand.sampling_down_factor=150
enable_bootloader=false
audio.device=default
audio.volume=80
display.output=
display.resolution=preferred
display.rotate=0
display.rgb_range=full
global.powermode=balanced
global.batterymode=balanced
global.game_powermode=highperformance
global.tdp=
global.retroachievements=false
global.retroachievements.hardcore=false
global.smooth=false
global.integerscale=false
global.use_guns=true
global.use_wheels=true
global.shaderset=none
global.retroarch.menu_driver=rgui
global.mangohud=false
content.catalog_url=https://hippos-linux.org/store/content-catalog.json
network.wol.enabled=false
system.wake_on_controller=false
system.hdmi_cec.enabled=false
system.sleep_timer=0
network.roms.enabled=true
network.roms.discovery.enabled=true
network.roms.discovery.auto_mount=false
global.vkbasalt=false
windows.dxvk=0
crt.enabled=false
global.save_sync_remote=
