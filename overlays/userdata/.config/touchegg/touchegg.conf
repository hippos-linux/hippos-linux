<touchegg>
  <settings>
    <property name="animation_delay">150</property>
    <property name="action_execute_threshold">20</property>
    <property name="color">auto</property>
    <property name="borderColor">auto</property>
  </settings>

  <application name="All">

    <!-- 2-finger swipe: list navigation -->
    <gesture type="SWIPE" fingers="2" direction="LEFT">
      <action type="SEND_KEYS">
        <keys>Right</keys>
        <repeat>true</repeat>
      </action>
    </gesture>

    <gesture type="SWIPE" fingers="2" direction="RIGHT">
      <action type="SEND_KEYS">
        <keys>Left</keys>
        <repeat>true</repeat>
      </action>
    </gesture>

    <gesture type="SWIPE" fingers="2" direction="UP">
      <action type="SEND_KEYS">
        <keys>Down</keys>
        <repeat>true</repeat>
      </action>
    </gesture>

    <gesture type="SWIPE" fingers="2" direction="DOWN">
      <action type="SEND_KEYS">
        <keys>Up</keys>
        <repeat>true</repeat>
      </action>
    </gesture>

    <!-- 2-finger tap: back / cancel -->
    <gesture type="TAP" fingers="2">
      <action type="SEND_KEYS">
        <keys>Escape</keys>
        <repeat>false</repeat>
      </action>
    </gesture>

    <!-- 3-finger swipe: exit emulator (sends hippos-hotkeys exit action) -->
    <gesture type="SWIPE" fingers="3" direction="DOWN">
      <action type="RUN_COMMAND">
        <command>hippos-hotkeys --send exit</command>
        <repeat>false</repeat>
        <on>end</on>
      </action>
    </gesture>

    <!-- 4-finger swipe down: save state -->
    <gesture type="SWIPE" fingers="4" direction="DOWN">
      <action type="RUN_COMMAND">
        <command>hippos-hotkeys --send save_state</command>
        <repeat>false</repeat>
        <on>end</on>
      </action>
    </gesture>

    <!-- 4-finger swipe up: load state -->
    <gesture type="SWIPE" fingers="4" direction="UP">
      <action type="RUN_COMMAND">
        <command>hippos-hotkeys --send load_state</command>
        <repeat>false</repeat>
        <on>end</on>
      </action>
    </gesture>

  </application>
</touchegg>
