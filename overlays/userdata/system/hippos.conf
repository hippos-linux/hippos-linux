# HippOS user settings
# Keys not set here fall back to OS defaults (/usr/share/hippos/hippos-defaults.conf).

# Core system behavior.
system.session=es
system.boot_session=es
system.desktop=lxqt
system.hostname=hippos
system.ssh.enabled=true
system.suspendmode=suspend
system.cpu.governor=performance

# Show the GRUB boot menu when another OS is detected.
enable_bootloader=true

# Audio.
audio.device=default
audio.volume=80

# Display.
display.output=
display.resolution=preferred

# GPU handling.
gpu.nvidia-driver=auto
gpu.nvidia-prime=true
gpu.radeon-prime=true
gpu.intel-prime=true

# RetroAchievements.
global.retroachievements=false
global.retroachievements.hardcore=false

# Global emulator options.
global.smooth=false
global.integerscale=false
global.use_guns=true
global.use_wheels=true
global.shaderset=none
global.mangohud=false
global.vkbasalt=false

# Content catalog.
content.catalog_url=https://hippos-linux.org/store/content-catalog.json

# Wake on LAN — wake this device from sleep via a magic packet (requires NIC + BIOS support).
network.wol.enabled=false

# Wake on controller — press a USB/dongle controller button to wake from suspend (S3).
# Requires BIOS USB wakeup enabled. Bluetooth controllers not supported.
system.wake_on_controller=false

# HDMI-CEC — power TV on/off automatically with the system (requires CEC-capable TV + cable).
system.hdmi_cec.enabled=false

# Sleep timer — auto-suspend after this many minutes of inactivity (0 = disabled).
system.sleep_timer=0

# Save sync — cloud backup and cross-machine save sharing.
# Set to the rclone remote name you configured (e.g. "gdrive", "dropbox", "s3").
# Leave blank to disable. Configure the remote with:
#   rclone --config /userdata/system/rclone/rclone.conf config
global.save_sync_remote=

# Mount selected network ROM sources.
network.roms.enabled=true
# Discover LAN shares for manual selection.
network.roms.discovery.enabled=true
# Automatically add likely ROM shares when discovered.
network.roms.discovery.auto_mount=false

# Steam.
steam.deckmode=false

# Windows / Wine.
windows.dxvk=true
windows.fsync=true
windows.esync=false

# Enable authentic 15kHz/25kHz/31kHz CRT output.
# auto: activates CRT mode if a connected native VGA or DVI-I port with no EDID is detected
#       at boot. LCDs send EDID; CRTs typically don't — this heuristic covers most native
#       analog setups automatically. Does NOT detect DAC adapters (see below).
# true: always enable. Use this if:
#         - auto fails to detect your CRT (some GPUs report VGA as disconnected)
#         - you are using a DP2VGA or HDMI2VGA DAC adapter (set crt.output too)
#         - your CRT sends EDID (some late-90s monitors)
# false: disable.
crt.enabled=auto
# CRT monitor profile used for modelines and EDID selection.
crt.monitor_profile=generic_15
# Output connector to drive.
# auto: scans for a connected native VGA/DVI-I port first; falls back to any connected output.
# For DAC adapters (DP2VGA, HDMI2VGA): set this to the DP or HDMI port your DAC is on,
# e.g. crt.output=DP-1 or crt.output=HDMI-A-1, and set crt.enabled=true.
# To find your connector name: ls /sys/class/drm/ | grep -v render
crt.output=auto
# Allow interlaced modes.
crt.interlace=true
# SwitchRes super-resolution width.
# auto: selects appropriate default based on GPU and connector type (e.g. 3840 for AMD HDMI, 2560 for VGA/DVI, 1920 for Intel).
crt.super_width=auto
# Minimum dot clock in MHz.
# auto: selects appropriate default based on GPU and connector type (e.g. 25.0 for HDMI, 0.0 for VGA/DVI/DP).
crt.dotclock_min=auto
# Base boot/session resolution used before launching games.
crt.boot_resolution=640x480i
# Optional default game videomode; per-system keys override it.
# Format: <width>x<height>@<hz> or leave blank for switchres auto-selection.
crt.videomode=

# TATE mode for vertical arcade monitors (rotated 90°/270°).
# off: no rotation (default, landscape monitors)
# ror: rotate-right (clockwise 90°) — monitor's top is to the right
# rol: rotate-left (counter-clockwise 90°) — monitor's top is to the left
# When set, MAME uses autoror/autorol so vertical ROMs display upright.
# For FBNeo libretro, also set: fbneo.video_allow_rotate=false (prevents double-rotation).
crt.tate_mode=off

# Per-system CRT video modes — uncomment and adjust to suit your monitor.
# These override crt.videomode for specific systems.
# 240p systems (15kHz progressive)
#nes.videomode=256x240@60
#snes.videomode=256x240@60
#megadrive.videomode=320x224@60
#mastersystem.videomode=256x224@60
#gb.videomode=160x144@60
#gbc.videomode=160x144@60
#gba.videomode=240x160@60
#pce.videomode=256x240@60
#pcengine.videomode=256x240@60
# 480i systems (15kHz interlaced)
#psx.videomode=320x240@60
#ps2.videomode=640x480@60
# Arcade (switchres chooses per-ROM when left blank)
#mame.videomode=
#fbneo.videomode=
