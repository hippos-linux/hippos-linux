# HippOS network ROM sources
# Physical drives are detected automatically. Any mounted drive containing a
# "roms" directory, a nested "userdata/roms" directory, or a root that already
# looks like a ROM library will be merged into /userdata/roms.
#
# Add network shares here if you want to include a NAS or remote share. The
# share can point at a parent containing "roms" or at the ROM library itself.
#
# NFS:
#   nfs:192.168.1.100:/exports/roms
#
# CIFS/Samba (optional credentials after share path):
#   cifs://192.168.1.100/roms
#   cifs://192.168.1.100/roms username=guest,password=
