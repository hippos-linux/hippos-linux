# The backend is chosen per machine by /usr/lib/hippos/hippos-picom (glx with
# hardware OpenGL, xrender otherwise) and overrides any backend set here.
vsync = true;
# With damage tracking, picom 12 leaves the area under the first desktop
# session's LXQt notifications black once they close (along with the tray
# icons beneath them) until something else redraws it. Repainting the whole
# screen on each update avoids that.
use-damage = false;

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
use-ewmh-active-win = true;

# Shadows
shadow = true;
shadow-radius = 12;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-opacity = 0.6;
shadow-exclude = [
    "name = 'Notification'",
    "_GTK_FRAME_EXTENTS@",
    "_NET_WM_WINDOW_TYPE@:a *= 'DESKTOP'"
];

# Fading
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 8;

# Opacity
inactive-opacity = 0.92;
active-opacity = 0.96;
frame-opacity = 0.90;
opacity-rule = [
    "96:class_g = 'pcmanfm-qt'",
    "94:class_g = 'qterminal'",
    "95:class_g = 'lxqt-config'"
];

# Rounded corners
corner-radius = 8;
rounded-corners-exclude = [
    "fullscreen"
];
