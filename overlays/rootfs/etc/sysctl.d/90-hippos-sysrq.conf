# Kernel default (config/kernel/amd64.config CONFIG_MAGIC_SYSRQ_DEFAULT_ENABLE)
# includes the reboot/poweroff and signal/kill bits. PrtScn is a known PC
# keyboard quirk that can alias to the kernel's Alt+SysRq combo at the raw
# scancode level, so a bare PrtScn press can reach kernel SysRq handling
# independent of hippos-hotkeys (see beta report: ATekGuy, Print Screen
# crashing the system). Keep sync/remount-ro/loglevel/keyboard-unraw for
# crash recovery, drop reboot/poweroff/process-kill/debug-dump.
kernel.sysrq = 54
