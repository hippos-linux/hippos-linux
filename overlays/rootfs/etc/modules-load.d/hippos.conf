# Kernel already ships CONFIG_EFI_VARS_PSTORE=m — without loading it, a
# panic/hard-crash leaves zero trace anywhere (see TryHrdChickn's crash
# report, 2026-08-22: /userdata/system/logs/ had nothing but upgrade.log,
# capture-boot-logs never got to run). Once loaded, a crash's kmsg survives
# in EFI variables across even a hard power-cycle; systemd-pstore.service
# (already enabled by default) imports it into the next boot's own journal
# automatically, which capture-boot-logs already captures via journalctl -b.
efi_pstore
