# Upstream ships TimeoutSec=0 (deliberately unbounded — see plymouth's own
# plymouth-quit-wait.service) because `plymouth --wait` is meant to hold
# until plymouthd genuinely exits. If plymouth-quit.service's own `plymouth
# quit` call fails to make plymouthd exit (seen on real hardware — DISC-001,
# 2026-08-17: plymouth-quit.service times out at its TimeoutSec=20 and
# fails, plymouthd never exits), this wait then blocks forever with no
# error. hippos-xserver.service orders After= this unit (see e369917) to
# avoid racing plymouth's vt handoff — but that means a stuck plymouthd
# wedges the entire graphical boot, silently, with no failing unit ever
# shown. Bounding it here lets the job fail instead of hang: After= (not
# Requires=) ordering only needs the job to finish, not succeed, so
# hippos-xserver still starts once this times out.
[Service]
TimeoutStartSec=15s
# Bounding the timeout above only stops it from hanging the *transaction* —
# plymouthd itself is still never told to die, so it keeps DRM master on the
# real GPU forever. hippos-xserver's Xorg then asks logind for the DRM
# device and gets back a *paused* fd (systemd-logind: "returned paused fd
# for drm node") because plymouthd still holds it, and just sits there —
# never crashing, never producing a picture, never logging again. EE never
# appearing on a real machine traced back to exactly this (boot-hang
# investigation, 2026-08-23). Force plymouthd dead once we've given up
# waiting for it to exit gracefully, so Xorg can actually take the device.
ExecStopPost=/bin/sh -c 'pkill -9 -x plymouthd 2>/dev/null || true'
