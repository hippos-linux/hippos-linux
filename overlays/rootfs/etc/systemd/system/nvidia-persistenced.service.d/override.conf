[Unit]
# Stock unit only has Wants=syslog.target — nothing orders it against the
# NVIDIA driver actually being ready. It races hippos-gpu-init.service
# (module load + device node creation) and loses often enough to show up as
# "Failed to start nvidia-persistenced.service" on the boot console (real
# hardware report, 2026-08-22).
After=hippos-gpu-init.service
Wants=hippos-gpu-init.service
# On a machine with no NVIDIA GPU at all (or where hippos-gpu-init picked
# nouveau/open over proprietary), the ordering fix above doesn't help —
# there is no driver to ever become ready, so this unconditionally fails
# every boot (real hardware report, all-Intel-iGPU machine, 2026-08-23).
# /proc/driver/nvidia/version only exists once the proprietary driver has
# actually attached, which is the same ground truth nvidia-persistenced
# itself needs — condition on it rather than re-deriving PCI-ID detection
# a second time (hippos-gpu-init already owns that logic).
ConditionPathExists=/proc/driver/nvidia/version

[Service]
# The ordering fix above only guarantees hippos-gpu-init.service has
# *finished* — on a legacy-tier card (DKMS-built out-of-tree module, e.g.
# GTX 970 on the 580 branch) the module can still take several more seconds
# past that to actually settle and produce /dev/nvidia0, so the first start
# attempt still loses the race and fails permanently with no retry (real
# hardware report, 2026-08-23). Give it a couple of short-interval retries
# rather than assuming the first attempt is authoritative.
Restart=on-failure
RestartSec=5
StartLimitIntervalSec=30
StartLimitBurst=3
