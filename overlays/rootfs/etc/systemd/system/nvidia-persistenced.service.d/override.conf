[Unit]
# Stock unit only has Wants=syslog.target — nothing orders it against the
# NVIDIA driver actually being ready. It races hippos-gpu-init.service
# (module load + device node creation) and loses often enough to show up as
# "Failed to start nvidia-persistenced.service" on the boot console (real
# hardware report, 2026-08-22).
After=hippos-gpu-init.service
Wants=hippos-gpu-init.service
