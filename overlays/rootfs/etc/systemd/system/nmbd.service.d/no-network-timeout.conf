[Service]
# Stock unit has no bound of its own beyond systemd's default 90s
# TimeoutStartSec — nmbd (Type=notify) never sends READY=1 until it sees a
# non-loopback IPv4 interface, and just sits logging "No local IPv4
# non-loopback interfaces available, waiting for interface ..." until then.
# On a machine with no cable/no link yet at boot, that's a real ~90-110s
# stall — and smbd.service/winbind.service are both explicitly ordered
# After=nmbd.service (see their own units), so multi-user.target (and
# graphical.target behind it) inherited the same delay (real hardware
# report, 2026-08-23: nmbd timeout at ~110s, winbind+smbd starting only
# seconds later). kb/guidance/boot-flow.md: "Do not block boot on internet
# access." Bound this unit specifically rather than lowering the global
# default (see /etc/default/grub's own note on why a global timeout knob
# was reverted) — 15s is enough for a live interface's DHCP/link-up to
# settle, short enough not to meaningfully delay boot when it's absent.
#
# Restart=on-failure lets it keep retrying in the background once network
# shows up later — RestartSec=15 exceeds systemd's default 10s
# StartLimitIntervalSec window, so retries never trip the default burst
# limit and this keeps trying indefinitely rather than giving up for the
# rest of the session.
TimeoutStartSec=15
Restart=on-failure
RestartSec=15
