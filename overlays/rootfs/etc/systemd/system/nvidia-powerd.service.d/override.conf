[Unit]
# Same reasoning as nvidia-persistenced.service.d/override.conf: stock unit
# is WantedBy=multi-user.target unconditionally, so it starts and restarts
# forever on a machine with no NVIDIA GPU at all. Condition on the driver
# actually being attached rather than re-deriving PCI-ID detection
# (hippos-gpu-init already owns that logic).
After=hippos-gpu-init.service
Wants=hippos-gpu-init.service
ConditionPathExists=/proc/driver/nvidia/version
