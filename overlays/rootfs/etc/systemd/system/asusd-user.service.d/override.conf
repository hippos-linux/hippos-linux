[Unit]
# Stock unit is WantedBy=default.target unconditionally — on non-ASUS
# hardware it starts, waits for the system asusd.service's D-Bus name
# (xyz.ljones.Asusd) which will never appear since asusd itself has nothing
# to manage, times out, and restarts forever (real hardware report, MSI
# motherboard/Intel iGPU, 2026-08-23). asus-nb-wmi's sysfs platform device
# only exists on genuine ASUS hardware the asus_wmi driver family attaches
# to, which is the same signal asusctl's own docs use to gate this.
ConditionPathExists=/sys/devices/platform/asus-nb-wmi
