# CRT mode — modesetting DDX. Deployed by hippos-crt-setup to /etc/X11/xorg.conf.d/.
# Used for Intel (i915) and Nouveau. Also an alternative for AMD hardware
# where the native amdgpu/radeon DDX causes problems with low-dotclock modelines.
# TearFree and VariableRefresh are disabled; neither is meaningful on a fixed-
# frequency CRT and both can interfere with direct KMS pageflips.
Section "OutputClass"
    Identifier  "CRT modesetting (amdgpu)"
    MatchDriver "amdgpu"
    Driver      "modesetting"
    Option      "TearFree"        "false"
    Option      "VariableRefresh" "false"
EndSection

Section "OutputClass"
    Identifier  "CRT modesetting (radeon)"
    MatchDriver "radeon"
    Driver      "modesetting"
    Option      "TearFree"        "false"
EndSection

Section "OutputClass"
    Identifier  "CRT modesetting (i915)"
    MatchDriver "i915"
    Driver      "modesetting"
    Option      "TearFree"        "false"
EndSection
