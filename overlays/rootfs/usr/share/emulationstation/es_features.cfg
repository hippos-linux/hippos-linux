      <choice name="Auto" value="auto" />
      <choice name="North West" value="NW" />
      <choice name="North East" value="NE" />
      <choice name="South East" value="SE" />
      <choice name="South West" value="SW" />
    </feature>
    <feature name="CUSTOM .PNG IMAGE PATH" value="bezel.tattoo_file" description="Custom image used for the bezel overlay." preset="input">
    </feature>
    <feature name="RESIZE TATTOO" value="bezel.resize_tattoo" description="Shrink or expand the bezel overlay to fit." preset="switch">
    </feature>
    <feature name="AUTOCONFIGURE CONTROLLERS" group="CONTROLLERS" value="disableautocontrollers" description="Automatically configure controllers on startup.">
      <choice name="On" value="" />
      <choice name="Off" value="1" />
    </feature>
    <feature name="RUN-AHEAD FRAMES" value="runahead" description="Render frames ahead of time to reduce input latency.">
      <choice name="Auto" value="" />
      <choice name="None" value="0" />
      <choice name="1" value="1" />
      <choice name="2" value="2" />
      <choice name="3" value="3" />
      <choice name="4" value="4" />
      <choice name="5" value="5" />
      <choice name="6" value="6" />
    </feature>
    <feature name="USE SECOND INSTANCE FOR RUN-AHEAD" value="secondinstance" description="Can prevent audio skips on button presses.">
      <choice name="Auto" value="" />
      <choice name="On" value="1" />
      <choice name="Off" value="0" />
    </feature>
    <feature name="AUTOMATIC FRAME DELAY" value="video_frame_delay_auto" description="Automatically decrease frame delay temporarily to prevent frame drops. Can introduce stuttering.">
      <choice name="Auto" value="" />
      <choice name="On" value="1" />
      <choice name="Off" value="0" />
    </feature>
    <feature name="VARIABLE REFRESH RATE" value="vrr_runloop_enable" description="Don't deviate from core requested timing. G-Sync, FreeSync, HDMI 2.1 VRR.">
      <choice name="Auto" value="" />
      <choice name="On" value="1" />
      <choice name="Off" value="0" />
    </feature>
    <feature name="GLOBAL TDP" value="tdp" description="AMD TDP cap in watts (requires ryzenadj)." preset="sliderauto" preset-parameters="5 35 1 W">
    </feature>
    <feature name="GAMESCOPE" submenu="GAMESCOPE" value="gamescope" description="Wrap games in Valve's Gamescope micro-compositor. Default Off">
      <choice name="Off" value="false" />
      <choice name="On" value="true" />
    </feature>
    <feature name="OUTPUT RESOLUTION" submenu="GAMESCOPE" value="gamescope_output_resolution" description="Output resolution for Gamescope. Default: current screen resolution">
      <choice name="Current" value="" />
      <choice name="1280x720" value="1280x720" />
      <choice name="1920x1080" value="1920x1080" />
      <choice name="2560x1440" value="2560x1440" />
      <choice name="3840x2160" value="3840x2160" />
      <choice name="640x480" value="640x480" />
      <choice name="800x600" value="800x600" />
      <choice name="1024x768" value="1024x768" />
