      <choice name="Stretch" value="stretch" />
      <choice name="Fit" value="fit" />
      <choice name="Fill" value="fill" />
      <choice name="Integer" value="integer" />
    </feature>
    <feature name="FILTER" submenu="GAMESCOPE" value="gamescope_filter" description="Upscaling filter. Default linear">
      <choice name="Linear" value="linear" />
      <choice name="Nearest" value="nearest" />
      <choice name="FSR" value="fsr" />
      <choice name="NIS" value="nis" />
      <choice name="Pixel" value="pixel" />
    </feature>
    <feature name="SHARPNESS" submenu="GAMESCOPE" value="gamescope_sharpness" description="Upscaler sharpness 0 (max) to 20 (min). Default disabled">
      <choice name="Disabled" value="" />
      <choice name="0 (Max)" value="0" />
      <choice name="5" value="5" />
      <choice name="10" value="10" />
      <choice name="15" value="15" />
      <choice name="20 (Min)" value="20" />
    </feature>
    <feature name="HDR" submenu="GAMESCOPE" value="gamescope_hdr" description="Enable HDR output if supported. Default Off">
      <choice name="Off" value="false" />
      <choice name="On" value="true" />
