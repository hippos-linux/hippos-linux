      <choice name="Square pixel" value="squarepixel" />
      <choice name="Core provided" value="core" />
      <choice name="Custom" value="custom" />
    </feature>
    <feature name="REWIND" value="rewind" description="Store past states to rewind to in realtime, if the core supports it.">
      <choice name="On" value="1" />
      <choice name="Off" value="0" />
    </feature>
    <feature name="AUTO SAVE/LOAD ON GAME LAUNCH" value="autosave" description="Load latest save state on game launch and save state when exiting game.">
      <choice name="On" value="1" />
      <choice name="Off" value="0" />
    </feature>
    <feature name="SHADER SET" value="shaderset" description="" preset="shaderset">
    </feature>
    <feature name="SMOOTH GAMES (BILINEAR FILTERING)" value="smooth" description="Disabled if using a shader set or the output display matches the game's resolution.">
      <choice name="Auto" value="auto" />
      <choice name="On" value="1" />
      <choice name="Off" value="0" />
    </feature>
    <feature name="INTEGER SCALING (PIXEL PERFECT)" value="integerscale" description="Only increase the image size in integer multiples.">
      <choice name="Auto" value="auto" />
      <choice name="On" value="1" />
      <choice name="Off" value="0" />
    </feature>
    <feature name="DECORATION SET" value="bezel" description="Select a decoration set for the current system." preset="decorationsets">
    </feature>
    <feature name="STRETCH BEZELS (4K &amp; ULTRAWIDE)" value="bezel_stretch" description="Stretch bezels to fill wide displays." preset="switchauto">
    </feature>
    <feature name="SHOW TATTOO OVER BEZEL" value="bezel.tattoo" description="Show an image overlaid on top of the bezel.">
      <choice name="Auto" value="auto" />
      <choice name="No" value="0" />
      <choice name="System Controllers" value="system" />
      <choice name="Custom Image" value="custom" />
    </feature>
