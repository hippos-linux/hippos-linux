# Runtime state directory — must be owned by hippos user so emulatorlauncher can write hotkey context files.
d /run/hippos 0775 root users -
f /run/hippos/hotkeys.context 0664 hippos users -

# Per-emulator runtime bundles (shadps4, lindbergh-loader) — without an
# explicit rule this only ever exists via mkdir(parents=True) from whichever
# emulator happens to touch it first, at whatever mode that produces.
d /run/hippos/emulators 0775 root users -
