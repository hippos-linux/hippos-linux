# hippos-es.service and hippos-desktop.service open logind sessions via
# PAMName=hippos-session, and pam_systemd moves each unit's main process into
# that session's own session-N.scope. Stopping the unit then only ends the PAM
# session — the processes in the scope (openbox + EmulationStation, or the
# whole desktop) are no longer in the unit's cgroup, so without this they
# survive every mode switch: ES stays fullscreen over the desktop, and its
# openbox keeps the window-manager selection the desktop's own WM needs.
# Scoped to hippos so root SSH/console sessions keep their processes.
[Login]
KillUserProcesses=yes
KillOnlyUsers=hippos
