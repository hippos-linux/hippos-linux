Section "OutputClass"
    Identifier  "CRT modesetting (amdgpu)"
    MatchDriver "amdgpu"
    Driver      "modesetting"
    Option      "TearFree"        "false"
    Option      "VariableRefresh" "false"
EndSection

Section "OutputClass"
    Identifier  "CRT modesetting (radeon)"
    MatchDriver "radeon"
    Driver      "modesetting"
    Option      "TearFree"        "false"
EndSection

Section "OutputClass"
    Identifier  "CRT modesetting (i915)"
    MatchDriver "i915"
    Driver      "modesetting"
    Option      "TearFree"        "false"
EndSection
