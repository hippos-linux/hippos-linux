# CRT mode — radeon DDX (older AMD pre-GCN hardware).
# Deployed by hippos-crt-setup to /etc/X11/xorg.conf.d/.
# Overrides 20-radeon.conf (TearFree=true).
Section "OutputClass"
    Identifier  "CRT Radeon GPU"
    Driver      "radeon"
    MatchDriver "radeon"
    Option      "TearFree" "false"
    Option      "DRI"      "2"
EndSection
