# CRT mode — amdgpu DDX. Deployed by hippos-crt-setup to /etc/X11/xorg.conf.d/.
# Overrides 20-amdgpu.conf (TearFree=true, VariableRefresh=true).
# TearFree inserts a shadow-FB blit path that breaks direct KMS pageflips;
# must be disabled for Switchres modeline switching to work correctly.
Section "OutputClass"
    Identifier  "CRT AMD GPU"
    Driver      "amdgpu"
    MatchDriver "amdgpu"
    Option      "TearFree"        "false"
    Option      "VariableRefresh" "false"
    Option      "DRI"             "3"
EndSection
