features:
  - padtokeyboard
custom_features:
  padtokey:
    prompt: CONTROLLER AS MOUSE
    description: The left stick moves the pointer and the bottom face button or R2 clicks. Turn off for games that support controllers.
    choices:
      On (Default): 1
      "Off": 0
  onscreen_keyboard:
    prompt: ON-SCREEN KEYBOARD
    description: Shows a keyboard at the bottom of the screen when a text box is selected.
    choices:
      On (Default): 1
      "Off": 0
  padtokey_mouse_speed:
    prompt: MOUSE SPEED
    description: How fast the left stick moves the pointer.
    preset: slider
    preset_parameters: 1 9 1 5
systems:
- name: desktopshortcuts
  as_core: desktopshortcuts
