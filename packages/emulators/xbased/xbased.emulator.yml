requireArtifact: xbased
arch: [amd64]
best_effort: true
shared_features:
  - powermode
  - tdp
  - platformprofile
  - videomode
custom_features:
  xbased_scale:
    prompt: RENDERING RESOLUTION
    description: Enhancement. Increase the rendering resolution.
    choices:
      1x (640x480): 1
      2x (1280x960): 2
      3x (1920x1440): 3
      4x (2560x1920): 4
      5x (3200x2400): 5
      6x (3840x2880): 6
      7x (4480x3360): 7
      8x (5120x3840): 8
  xbased_aspect:
    prompt: ASPECT RATIO
    choices:
      Auto (Default): auto
      4x3: '4:3'
      16x9: '16:9'
      Stretch: stretch
  xbased_precision:
    prompt: GPU PRECISION
    description: Exact matches the console's graphics chip. Fast suits older and integrated GPUs.
    choices:
      Automatic (Default): auto
      Exact: exact
      Fast: fast
systems:
  - name: xbox
    exclude_extensions:
      - squashfs
